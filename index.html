  flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  background:var(--bg);
}
#canvasWrap::before{
  content:''; position:absolute; inset:-15%; z-index:0; pointer-events:none;
  background:
    repeating-linear-gradient(100deg, rgba(255,255,255,.05) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(100deg, rgba(0,0,0,.35) 0 1px, transparent 1px 7px),
    radial-gradient(closest-side at 28% 38%, var(--rib-a), transparent 70%),
    radial-gradient(closest-side at 78% 68%, var(--rib-b), transparent 70%),

  background-size:auto, auto, 130% 130%, 130% 130%, auto;
  filter:blur(34px) saturate(1.25);
  opacity:.55;
  animation:ribDrift 22s ease-in-out infinite alternate;
}
#canvasWrap::after{
  content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 46px),

  opacity:.6; mix-blend-mode:overlay;
}
@keyframes ribDrift{

  100%{ background-position:0 0, 0 0, 40% 55%, 60% 45%, 0 0; }
}
@media (prefers-reduced-motion: reduce){ #canvasWrap::before{ animation:none; } }
.frame{ position:relative; z-index:2; }

/* MAP PALETTE
   Land / суша: #ffc26f — with darker/lighter terrain depth shades
   Mushroom islands / грибные острова: #c16fff — with depth shades
   Ocean / океан: #003d90 — with depth shades
   Native preview/export resolution: 1400 × 1400
*/
/* FINAL VISUAL PASS — Eclipse Space inspired / Cherry-PRJ
   The map-generation logic and controls remain unchanged. */
:root{
  --bg:#07080a;
  --panel:#0c0d10;
  --panel2:#111318;
  --line:#272a30;
  --text:#f7f7f5;
  --dim:#8b8d93;
  --accent:#c16fff;
  --accent-soft:rgba(193,111,255,.16);
  --map-water:#003d90;
  --map-land:#ffc26f;
  --map-void:#c16fff;
  --danger:#ff6b75;
  --font-ui:'DM Sans',Arial,sans-serif;
  --font-heavy:'Space Grotesk',Arial,sans-serif;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--font-ui);font-weight:500;letter-spacing:-.01em}
body::before{display:none}
.glass-ridge{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none;background-image:none}

/* Header */
header{
  min-height:78px;padding:16px 28px;gap:18px;background:#07080a;
  border-bottom:1px solid var(--line);box-shadow:none
}
header::before,header::after{display:none}
.logotype{display:flex;align-items:center;gap:0;min-width:230px}
.brand-logo{width:42px;height:42px;object-fit:contain;display:block;margin-right:12px}
.brand-wordmark,.logotype .grot{
  font-family:var(--font-heavy);font-size:23px;line-height:1;font-weight:700;
  letter-spacing:-.075em;color:#fff
}
.logotype .grot{margin-left:2px}
.logotype .serif{display:none}
header .sub{
  color:#777a81;border-left:1px solid var(--line);font-family:var(--font-ui);
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase
}
header label.sub{border:0}
#worldWidth{
  background:#0b0c0f!important;border:1px solid #30333a!important;border-radius:3px!important;
  color:#fff!important;padding:9px 10px!important;font:600 12px var(--font-ui)!important
}
.btn{
  background:#0b0c0f;color:#f4f4f2;border:1px solid #30333a;border-radius:3px;
  padding:10px 14px;font:600 11px var(--font-ui);letter-spacing:.01em;box-shadow:none;
  transition:background .15s,border-color .15s,color .15s,transform .15s
}
.btn:hover{background:#151219;border-color:var(--accent);color:#fff;transform:translateY(-1px)}
.btn.primary{background:#fff;color:#07080a;border-color:#fff;font-weight:700}
.btn.primary:hover{background:#ececef;border-color:#ececef;color:#07080a}

/* Left workspace */
#layers{
  width:300px;flex:0 0 300px;background:#0a0b0e;border-right:1px solid var(--line);box-shadow:none
}
#layerList{padding:18px 14px 10px;scrollbar-color:#343740 transparent}
#layerList::before{
  content:'WORLD LAYERS';display:block;margin:0 8px 12px;color:#666a72;
  font:700 9px 'IBM Plex Mono',monospace;letter-spacing:.16em
}
.layer-item{
  border-radius:3px;padding:11px 12px;margin-bottom:5px;border:1px solid transparent;
  background:transparent;color:#dedee0;font:600 12px var(--font-ui);
  transition:background .15s,border-color .15s,transform .15s
}
.layer-item:hover{background:#121419;border-color:#2c2f36;transform:translateX(2px)}
.layer-item.active{
  background:#141219;border-color:rgba(193,111,255,.55);box-shadow:inset 2px 0 var(--accent)
}
.layer-item .dot{width:7px;height:7px;border-radius:1px;box-shadow:none}
.layer-item .name{font-weight:600}
.layer-item .del{opacity:.5}
.layer-item .del:hover{color:var(--danger);opacity:1}
#addLayer{
  margin:8px 14px 14px;padding:11px 12px;text-align:left;border:1px dashed #383b43;
  background:#0b0c0f;color:#bfc1c7
}
#addLayer:hover{border-color:var(--accent);background:var(--accent-soft)}

/* Editor */
#editor{padding:20px 16px 22px;border-top:1px solid var(--line);background:#090a0d}
#editor h3{
  color:#aeb0b6;font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;
  text-transform:uppercase;margin:0 0 15px;padding-bottom:10px;border-bottom:1px solid #24272d
}
#editor h3::after{content:'';display:block;width:28px;height:1px;margin-top:9px;background:var(--accent)}
.field{margin-bottom:13px}
.field label{color:#858890;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.02em;margin-bottom:6px}
.field input[type=text],.field input[type=number]{
  background:#0e1014;border:1px solid #2d3037;color:#f4f4f2;padding:9px 10px;
  border-radius:3px;font:500 12px 'IBM Plex Mono',monospace
}
.field input:focus{
  border-color:rgba(193,111,255,.8);box-shadow:0 0 0 3px rgba(193,111,255,.08);outline:none
}

/* Dark custom toggle — replaces the white native checkbox */
.check{
  display:flex;align-items:center;gap:10px;padding:10px 11px;margin:2px 0 13px;
  border:1px solid #25282e;border-radius:3px;background:#0d0f13;color:#d9d9dc;
  font-size:11px;font-weight:600
}
.check input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;width:34px;height:20px;flex:0 0 34px;margin:0;
  border:1px solid #4a4d55;border-radius:999px;background:#17191e;position:relative;cursor:pointer;
  transition:background .16s,border-color .16s,box-shadow .16s
}
.check input[type="checkbox"]::after{
  content:'';position:absolute;width:12px;height:12px;top:3px;left:3px;border-radius:50%;
  background:#777a82;transition:transform .16s,background .16s
}
.check input[type="checkbox"]:checked{
  background:#241b2d;border-color:var(--accent);box-shadow:0 0 0 2px rgba(193,111,255,.08)
}
.check input[type="checkbox"]:checked::after{transform:translateX(14px);background:#fff}
.check input[type="checkbox"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check label{margin:0!important;color:#dedee1!important;font-size:12px!important;font-weight:600}

/* Map stage */
#canvasWrap{background:#07080a;isolation:isolate}
#canvasWrap::before{
  inset:0;
  background:
    radial-gradient(ellipse at 50% 44%,rgba(0,61,144,.20),transparent 48%),
    radial-gradient(ellipse at 78% 72%,rgba(193,111,255,.08),transparent 34%);
  filter:none;opacity:1;animation:none
}
#canvasWrap::after{
  background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:40px 40px;opacity:.5;mix-blend-mode:normal
}
.frame{padding:20px;filter:none}
.frame::before,.frame::after,.frame i::before,.frame i::after{display:none}
canvas{
  border:1px solid rgba(193,111,255,.55);border-radius:2px;
  box-shadow:0 0 0 1px rgba(193,111,255,.10),0 24px 70px rgba(0,0,0,.55);
  image-rendering:pixelated
}
.map-toolbar{
  top:18px;right:18px;gap:3px;padding:4px;background:#0b0c0f;border:1px solid #30333a;
  border-radius:3px;box-shadow:0 10px 28px rgba(0,0,0,.35);backdrop-filter:none
}
.zoom-btn,.fit-btn{
  height:30px;min-width:31px;border:1px solid transparent;border-radius:2px;color:#ededee;
  background:transparent;font:600 13px 'IBM Plex Mono',monospace
}
.zoom-btn:hover,.fit-btn:hover{border-color:var(--accent);color:#fff;background:var(--accent-soft)}
#zoomValue{color:#aaaeb5;font-weight:600}
.toolbar-divider{background:#30333a}
#status{
  bottom:17px;left:18px;background:#0b0c0f;border:1px solid #30333a;border-radius:3px;
  color:#92959c;font-size:10px;padding:7px 9px;box-shadow:none;backdrop-filter:none
}
.map-hint{bottom:18px;right:18px;color:#686c74;font:600 10px 'IBM Plex Mono',monospace;padding:0;border:0;background:none}
#mapCoords{position:absolute;z-index:6;display:none;pointer-events:none;background:rgba(13,13,14,.94);border:1px solid #303033;border-radius:2px;color:#f4f4f2;padding:6px 8px;font:10px 'IBM Plex Mono',monospace;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28)}
::-webkit-scrollbar-thumb{background:#343740;border-radius:2px}
h1,h2,h3,.btn,.layer-item,.check,.sub{font-synthesis:none}

  header{padding:14px 18px}
  #layers{width:270px;flex-basis:270px}

  .brand-logo{width:34px;height:34px;margin-right:9px}

/* JSON import + undo/redo */
.header-divider{width:1px;height:24px;display:inline-block;background:#30333a;margin:0 2px}
.icon-btn{min-width:38px;padding:9px 10px!important;font-size:18px!important;line-height:1}
.icon-btn:disabled{opacity:.28;cursor:default;border-color:#24262b;color:#686b72}
#toast{
  position:absolute;right:18px;bottom:18px;z-index:20;
  max-width:min(440px,calc(100% - 36px));padding:10px 13px;
  border:1px solid #30333a;border-radius:3px;background:#0b0c0f;color:#dfe0e3;
  font:600 11px var(--font-ui);letter-spacing:.01em;
  box-shadow:0 12px 34px rgba(0,0,0,.45);
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;
}
#toast.show{opacity:1;transform:translateY(0)}
#toast.error{border-color:rgba(255,107,117,.6);color:#ffb5ba}
#toast.success{border-color:rgba(193,111,255,.6);color:#ead8ff}


/* The 1400×1400 canvas is high-res internally, but starts visually compact.
   Zooming the frame makes it cover the eye. */
#canvasWrap canvas{
  width:min(760px,72vw,65vh);
  height:auto;
  aspect-ratio:1;
}
#canvasWrap input[type=number]::-webkit-inner-spin-button,
#canvasWrap input[type=number]::-webkit-outer-spin-button,
#worldWidth::-webkit-inner-spin-button,
#worldWidth::-webkit-outer-spin-button{
  filter:invert(1);
}
#editor input[type=number]::-webkit-inner-spin-button,
#editor input[type=number]::-webkit-outer-spin-button{

}
@media(max-width:650px){

/* Static author credit — no cursor interaction */
#canvasWrap .static-credit{
  position:absolute;
  left:50%;
  top:20px;
  transform:translateX(-50%);
  z-index:3;
  color:#777;

  line-height:1;

/* ---------- reference image ---------- */
.reference-layer{position:absolute;left:20px;top:20px;width:calc(100% - 40px);height:calc(100% - 40px);z-index:3;pointer-events:none;display:none;overflow:hidden;border:1px solid rgba(193,111,255,.55);border-radius:2px;box-shadow:0 0 0 1px rgba(193,111,255,.08),0 18px 55px rgba(0,0,0,.28)}
.reference-layer img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
.reference-layer.mini{width:190px;height:190px;left:28px;top:28px;border-color:rgba(255,255,255,.55);background:#090a0d;box-shadow:0 12px 35px rgba(0,0,0,.48),0 0 0 5px rgba(7,8,10,.7)}
.reference-layer.mini img{object-fit:cover}
.reference-layer.full{display:block}
.reference-layer.full img{opacity:.34}
.reference-layer.mini img{opacity:.9}
.reference-controls{display:none;align-items:center;gap:5px;margin-left:2px}
.reference-controls.active{display:flex}
.reference-controls .ref-btn.visibility-hidden{border-color:#555;color:var(--dim)}
.reference-controls .ref-btn{min-width:31px;height:30px;padding:0 9px;border:1px solid #30333a;border-radius:2px;background:#0b0c0f;color:#ededee;font:600 11px var(--font-ui);cursor:pointer}
.reference-controls .ref-btn:hover,.reference-controls .ref-btn.active{border-color:var(--accent);color:#fff;background:var(--accent-soft)}
.reference-controls .ref-close{color:#92959c}
.reference-controls .ref-close:hover{color:#ff6b75;border-color:#ff6b75}
#referenceFile{display:none}
@media(max-width:900px){.reference-controls{order:10}}
@media(max-width:650px){.reference-controls{width:100%;margin-top:2px}.reference-layer.mini{width:145px;height:145px;left:18px;top:18px}}

</style>

<script>
// ---------- noise (seeded, multi-octave value noise — прототип, не бит-в-бит как в MC) ----------
function hashStr(s){ s=String(s); let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function makeGradients(rng,n){
  const g=new Float64Array(n*2);
  for(let i=0;i<n;i++){ const a=rng()*Math.PI*2; g[i*2]=Math.cos(a); g[i*2+1]=Math.sin(a); }
  return g;
}
function fade(t){ return t*t*t*(t*(t*6-15)+10); }
function makePerm(rng){
  const p=new Uint16Array(512);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=p[i]; p[i]=p[j]; p[j]=t; }
  for(let i=0;i<256;i++)p[i+256]=p[i];
  return p;
}
// Same sampling/indexing as the original generator; only storage/access is optimized.
function noise2D(perm,grads,x,z){
  const x0=Math.floor(x), z0=Math.floor(z), xf=x-x0, zf=z-z0;
  const pz=perm[z0&255];
  const pz1=perm[(z0+1)&255];
  const g00=(perm[(x0&255)+pz]&15), g10=(perm[((x0+1)&255)+pz]&15);
  const g01=(perm[(x0&255)+pz1]&15), g11=(perm[((x0+1)&255)+pz1]&15);
  const n00=grads[g00*2]*xf+grads[g00*2+1]*zf;
  const n10=grads[g10*2]*(xf-1)+grads[g10*2+1]*zf;
  const n01=grads[g01*2]*xf+grads[g01*2+1]*(zf-1);
  const n11=grads[g11*2]*(xf-1)+grads[g11*2+1]*(zf-1);
  const u=fade(xf), v=fade(zf);
  const a=n00+u*(n10-n00), b=n01+u*(n11-n01);
  return (a+v*(b-a))*1.4142;
}
function makeOctaveNoise(seed, firstOctave, amplitudes, scale){
  const base=mulberry32(hashStr(seed));
  const octaves=amplitudes.map((amp,i)=>{
    const r=mulberry32((base()*4294967296)>>>0 ^ (i*2654435761));
    return { amp, freq:Math.pow(2, firstOctave+i), perm:makePerm(r), grads:makeGradients(r,16) };
  });
  const ampSum=amplitudes.reduce((a,b)=>a+Math.abs(b),0)||1;
  return function(x,z){
    let v=0;
    for(const o of octaves){ if(o.amp===0) continue; v += o.amp * noise2D(o.perm,o.grads, x*o.freq, z*o.freq); }
    return (v/ampSum) * scale;
  };
}

// ---------- continent math (hill + noise edge + overlap/sum) ----------
function hill(x,z){ return Math.pow(2, -(x*x+z*z)); }
function buildContinent(c){
  const rot=-c.rotation*Math.PI/180;
  const sin=Math.sin(rot), cos=Math.cos(rot);
  const xSize=1/c.xDivisor, zSize=1/c.zDivisor;
  return {
    ...c,
    sin, cos,
    xSize, zSize,
    sizeMax:Math.max(xSize,zSize),
    rotated:c.rotation!==0,
    sampleNoise:makeOctaveNoise(c.noise.seed,c.noise.firstOctave,c.noise.amplitudes,c.noise.scale)
  };
}
function computeValue(x,z,built){
  let value=0;
  for(let i=0;i<built.length;i++){
    const c=built[i];
    let dx=x-c.centerX, dz=z-c.centerZ;
    if(c.rotated){ const rx=dx*c.cos-dz*c.sin; dz=dx*c.sin+dz*c.cos; dx=rx; }
    const q=(dx*c.xSize)*(dx*c.xSize)+(dz*c.zSize)*(dz*c.zSize);
    let v=Math.pow(2,-q)*2;
    if(v>0.5) v += Math.cos(v*Math.PI)*c.sampleNoise(dx*c.sizeMax,dz*c.sizeMax);
    v *= c.multiplier;
    value=c.overlap ? Math.max(value,v) : value+v;
  }
  return value-1;
}

// ---------- state ----------
let state = {
  worldWidth:4000,
  continents:[
    { id:1, name:'Ядро', overlap:true, multiplier:1.0, centerX:0, centerZ:0, xDivisor:900, zDivisor:900, rotation:0,
      noise:{seed:'12', firstOctave:1, scale:0.45, amplitudes:[1,1,1,1]} },
    { id:2, name:'Залив A', overlap:false, multiplier:-0.7, centerX:450, centerZ:300, xDivisor:260, zDivisor:260, rotation:20,
      noise:{seed:'34', firstOctave:1, scale:0.4, amplitudes:[1,1,1]} },
    { id:3, name:'Залив B', overlap:false, multiplier:-0.7, centerX:-420, centerZ:-350, xDivisor:280, zDivisor:280, rotation:-15,
      noise:{seed:'56', firstOctave:1, scale:0.4, amplitudes:[1,1,1]} },
  ],
  nextId:4, selected:1
};
try{ const saved=localStorage.getItem('cherry-prj-state'); if(saved) state=JSON.parse(saved); }catch(e){}

function save(){ try{ localStorage.setItem('cherry-prj-state', JSON.stringify(state)); }catch(e){} }

// ---------- undo / redo ----------
const undoStack=[];
const redoStack=[];
const HISTORY_LIMIT=80;
let historyEditSnapshot=null;

function snapshotState(){
  return JSON.parse(JSON.stringify(state));
}
function statesEqual(a,b){
  return JSON.stringify(a)===JSON.stringify(b);
}
function pushHistory(before){
  if(!before) return;
  undoStack.push(before);
  if(undoStack.length>HISTORY_LIMIT) undoStack.shift();
  redoStack.length=0;
  updateHistoryButtons();
}
function beginFieldHistory(){
  if(!historyEditSnapshot) historyEditSnapshot=snapshotState();
}
function finishFieldHistory(){
  if(historyEditSnapshot){
    const before=historyEditSnapshot;
    historyEditSnapshot=null;
    if(!statesEqual(before,state)) pushHistory(before);
  }
}
function restoreState(next){
  state=JSON.parse(JSON.stringify(next));
  document.getElementById('worldWidth').value=state.worldWidth;
  renderLayers();
  renderEditor();
  scheduleRender();
  save();
  updateHistoryButtons();
}
function undo(){
  finishFieldHistory();
  if(!undoStack.length) return;
  const current=snapshotState();
  const previous=undoStack.pop();
  redoStack.push(current);
  restoreState(previous);
  showToast('Изменение отменено', 'success');
}
function redo(){
  finishFieldHistory();
  if(!redoStack.length) return;
  const current=snapshotState();
  const next=redoStack.pop();
  undoStack.push(current);
  restoreState(next);
  showToast('Изменение возвращено', 'success');
}
function updateHistoryButtons(){
  const u=document.getElementById('undoBtn');
  const r=document.getElementById('redoBtn');
  if(u) u.disabled=undoStack.length===0;
  if(r) r.disabled=redoStack.length===0;
}
function showToast(message,type='error'){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=message;
  el.className='';
  el.classList.add('show',type);
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{el.classList.remove('show');},3200);
}

// ---------- UI: layer list ----------
const layerList=document.getElementById('layerList');
const editorEl=document.getElementById('editor');
function colorForLayer(c){ return c.multiplier>=0 ? '#ffc26f' : '#c16fff'; }

function renderLayers(){
  layerList.innerHTML='';
  state.continents.forEach(c=>{
    const el=document.createElement('div');
    el.className='layer-item'+(c.id===state.selected?' active':'');
    el.innerHTML=`<span class="dot" style="background:${colorForLayer(c)}"></span><span class="name">${c.name}</span><span class="del" title="Удалить">✕</span>`;
    el.onclick=(e)=>{ if(e.target.classList.contains('del')){ removeLayer(c.id); return; } state.selected=c.id; renderLayers(); renderEditor(); };
    layerList.appendChild(el);
  });
}
function removeLayer(id){
  const before=snapshotState();
  state.continents=state.continents.filter(c=>c.id!==id);
  if(state.continents.length && state.selected===id) state.selected=state.continents[0].id;
  renderLayers(); renderEditor(); scheduleRender(); save(); pushHistory(before);
}
document.getElementById('addLayer').onclick=()=>{
  const before=snapshotState();
  const id=state.nextId++;
  state.continents.push({ id, name:'Континент '+id, overlap:false, multiplier:-0.5, centerX:0, centerZ:0, xDivisor:300, zDivisor:300, rotation:0,
    noise:{seed:String(id*7+3), firstOctave:1, scale:0.4, amplitudes:[1,1,1]} });
  state.selected=id; renderLayers(); renderEditor(); scheduleRender(); save();
};

function field(label, value, onChange, type='number', step='any'){
  const wrap=document.createElement('div'); wrap.className='field';
  const l=document.createElement('label'); l.textContent=label; wrap.appendChild(l);
  const inp=document.createElement('input'); inp.type=type; inp.value=value; if(type==='number') inp.step=step;
  inp.onfocus=()=>beginFieldHistory();
  inp.oninput=()=>{ onChange(type==='number'? parseFloat(inp.value||'0') : inp.value); scheduleRender(); save(); };
  inp.onblur=()=>finishFieldHistory();
  wrap.appendChild(inp);
  return wrap;
}

function renderEditor(){
  editorEl.innerHTML='';
  const c=state.continents.find(x=>x.id===state.selected);
  if(!c){ editorEl.innerHTML='<h3>Нет слоя</h3>'; return; }
  const h=document.createElement('h3'); h.textContent='Параметры слоя'; editorEl.appendChild(h);
  editorEl.appendChild(field('Название', c.name, v=>{c.name=v; renderLayers();}, 'text'));

  const chk=document.createElement('div'); chk.className='check';
  chk.innerHTML=`<input type="checkbox" id="ov" ${c.overlap?'checked':''}> <label for="ov" style="font-size:13px;color:var(--text)">overlap (максимум вместо суммы)</label>`;
  chk.querySelector('input').onchange=(e)=>{
    const before=snapshotState();
    c.overlap=e.target.checked;
    scheduleRender(); save(); pushHistory(before);
  };
  editorEl.appendChild(chk);

  const row1=document.createElement('div'); row1.className='row2';
  row1.appendChild(field('center_x', c.centerX, v=>c.centerX=v));
  row1.appendChild(field('center_z', c.centerZ, v=>c.centerZ=v));
  editorEl.appendChild(row1);

  const row2=document.createElement('div'); row2.className='row2';
  row2.appendChild(field('x_divisor (размер)', c.xDivisor, v=>c.xDivisor=Math.max(1,v)));
  row2.appendChild(field('z_divisor (размер)', c.zDivisor, v=>c.zDivisor=Math.max(1,v)));
  editorEl.appendChild(row2);

  const row3=document.createElement('div'); row3.className='row2';
  row3.appendChild(field('rotation_degrees', c.rotation, v=>c.rotation=v));
  row3.appendChild(field('multiplier', c.multiplier, v=>c.multiplier=v, 'number', '0.05'));
  editorEl.appendChild(row3);

  const h2=document.createElement('h3'); h2.style.marginTop='16px'; h2.textContent='Шум края'; editorEl.appendChild(h2);
  editorEl.appendChild(field('seed', c.noise.seed, v=>c.noise.seed=v, 'text'));
  const row4=document.createElement('div'); row4.className='row2';
  row4.appendChild(field('first_octave', c.noise.firstOctave, v=>c.noise.firstOctave=Math.round(v)));
  row4.appendChild(field('scale', c.noise.scale, v=>c.noise.scale=v, 'number', '0.05'));
  editorEl.appendChild(row4);
  editorEl.appendChild(field('amplitudes (через запятую)', c.noise.amplitudes.join(','), v=>{ c.noise.amplitudes=v.split(',').map(s=>parseFloat(s.trim())||0); }, 'text'));
}

// ---------- render canvas ----------
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const statusEl=document.getElementById('status');
const mapCoords=document.getElementById('mapCoords');
const renderModeBtn=document.getElementById('renderModeBtn');
let renderPending=false;
let renderMode='manual';
try{
  renderMode=localStorage.getItem('cherry-prj-render-mode')==='live'?'live':'manual';
}catch(e){}
function updateRenderModeUI(){
  renderModeBtn.textContent=renderMode==='live'?'Режим: Live':'Режим: Enter';
  renderModeBtn.classList.toggle('live-mode',renderMode==='live');
  renderModeBtn.title=renderMode==='live'?'Обновление карты происходит сразу':'Обновление карты происходит по Enter';
}
function setRenderMode(mode){
  renderMode=mode==='live'?'live':'manual';
  try{localStorage.setItem('cherry-prj-render-mode',renderMode);}catch(e){}
  updateRenderModeUI();
  if(renderMode==='live' && renderPending){ doRender(); save(); }
  else if(renderMode==='live') statusEl.textContent='Готово · Live';
}
function layerRawValue(x,z,c){
  const rot=-c.rotation*Math.PI/180;
  const sin=Math.sin(rot), cos=Math.cos(rot);
  let dx=x-c.centerX, dz=z-c.centerZ;
  if(c.rotation!==0){ const rx=dx*cos-dz*sin, rz=dx*sin+dz*cos; dx=rx; dz=rz; }
  const xSize=1/Math.max(1,c.xDivisor), zSize=1/Math.max(1,c.zDivisor);
  const sizeMax=Math.max(xSize,zSize);
  const noise=makeOctaveNoise(c.noise.seed,c.noise.firstOctave,c.noise.amplitudes,c.noise.scale);
  let v=hill(dx*xSize,dz*zSize)*2;
  if(v>0.5) v += Math.cos(v*Math.PI)*noise(dx*sizeMax,dz*sizeMax);
  return v;
}
function scheduleRender(){
  renderPending=true;
  if(renderMode==='live'){
    doRender();
    save();
    return;
  }
  statusEl.textContent='Изменения не применены · Enter';
}

function doRender(){
  renderPending=false;
  // Requested palette: water #003d90 · land #ffc26f · purple #c16fff
  const t0=performance.now();
  const w=cv.width, h=cv.height;
  const worldWidth=state.worldWidth=parseFloat(document.getElementById('worldWidth').value)||4000;
  const worldHeight=worldWidth*(h/w);
  const built=state.continents.map(buildContinent);
  const img=ctx.createImageData(w,h);
  const corner=[-worldWidth/2, -worldHeight/2];
  const scale=worldWidth/w;
  let min=0,max=0;
  for(let x=0;x<w;x++){
    for(let z=0;z<h;z++){
      const wx=corner[0]+x*scale, wz=corner[1]+z*scale;
      const v=computeValue(wx,wz,built);
      if(v<min)min=v; if(v>max)max=v;
      let r,g,b;
      // Minecraft continentalness visualization with depth-aware gradients.
      // Mushroom islands: N < -1.05  -> purple family
      // Ocean:            -1.05..0.1 -> blue family
      // Land:             N >= 0.1    -> orange/yellow family
      //
      // Each family keeps the requested base color as its visual anchor:
      // #c16fff / #003d90 / #ffc26f.
      const mixColor=(a,b,t)=>{
        t=Math.max(0,Math.min(1,t));
        return [
          Math.round(a[0]+(b[0]-a[0])*t),
          Math.round(a[1]+(b[1]-a[1])*t),
          Math.round(a[2]+(b[2]-a[2])*t)
        ];
      };
      const writeColor=(c)=>{ r=c[0]; g=c[1]; b=c[2]; };

      if(v < -1.05){
        // Deeper / more extreme mushroom continentalness = darker purple.
        // Approaching -1.05 = brighter purple.
        const t=Math.max(0,Math.min(1,(v+1.20)/0.15));
        if(t<0.5){
          writeColor(mixColor([0x45,0x1d,0x70],[0xc1,0x6f,0xff],t*2));
        }else{
          writeColor(mixColor([0xc1,0x6f,0xff],[0xe6,0xc2,0xff],(t-0.5)*2));
        }
      }
      else if(v < 0.1){
        // Deeper ocean = darker blue; shallower ocean = lighter blue.
        const t=Math.max(0,Math.min(1,(v+1.05)/1.15));
        if(t<0.5){
          writeColor(mixColor([0x00,0x18,0x4a],[0x00,0x3d,0x90],t*2));
        }else{
          writeColor(mixColor([0x00,0x3d,0x90],[0x3d,0x79,0xc7],(t-0.5)*2));
        }
      }
      else{
        // Lower land values = darker / lower terrain; higher values = brighter.
        const t=Math.max(0,Math.min(1,(v-0.1)/0.9));
        if(t<0.5){
          writeColor(mixColor([0xa0,0x52,0x2d],[0xff,0xc2,0x6f],t*2));
        }else{
          writeColor(mixColor([0xff,0xc2,0x6f],[0xff,0xe4,0xb0],(t-0.5)*2));
        }
      }
      const i=(z*w+x)*4; img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  statusEl.textContent = `min ${min.toFixed(2)} · max ${max.toFixed(2)} · ${(performance.now()-t0)|0}ms`;
}

const worldWidthInput=document.getElementById('worldWidth');
worldWidthInput.onfocus=()=>beginFieldHistory();
worldWidthInput.oninput=()=>{ state.worldWidth=parseFloat(worldWidthInput.value)||4000; scheduleRender(); save(); };
worldWidthInput.onblur=()=>finishFieldHistory();

document.getElementById('undoBtn').onclick=undo;
document.getElementById('redoBtn').onclick=redo;
renderModeBtn.onclick=()=>setRenderMode(renderMode==='live'?'manual':'live');
updateRenderModeUI();

window.addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='m' && !e.ctrlKey && !e.metaKey && !e.altKey){
    const tag=(e.target?.tagName||'').toLowerCase();
    if(tag!=='input' && tag!=='textarea' && tag!=='select' && !e.target?.isContentEditable){
      e.preventDefault();
      cycleReferenceMode();
      return;
    }
  }
  if(e.key==='Enter' && !e.ctrlKey && !e.metaKey){
    e.preventDefault();
    if(renderMode==='manual' && renderPending){
      finishFieldHistory();
      doRender();
      save();
    }
    return;
  }
  const mod=e.ctrlKey||e.metaKey;
  if(!mod) return;
  if(e.key.toLowerCase()==='z'){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }else if(e.key.toLowerCase()==='y'){
    e.preventDefault();
    redo();
  }
});

document.getElementById('pngBtn').onclick=()=>{
  const a=document.createElement('a'); a.download='cherry-prj-island.png'; a.href=cv.toDataURL('image/png'); a.click();
};

function buildEntriesJson(){
  const entries=state.continents.map(c=>({
    overlap:c.overlap,
    noise:{ amplitudes:c.noise.amplitudes, seed:String(c.noise.seed), first_octave:c.noise.firstOctave, scale:c.noise.scale },
    x_divisor:c.xDivisor, z_divisor:c.zDivisor, rotation_degrees:c.rotation, multiplier:c.multiplier,
    center_x:c.centerX, center_z:c.centerZ
  }));
  return JSON.stringify({entries},null,2);
}


function validateConfigJson(value){
  if(!value || typeof value!=='object' || Array.isArray(value)){
    return {ok:false,error:'Ожидается JSON-объект с полем "entries".'};
  }
  if(!Array.isArray(value.entries) || value.entries.length===0){
    return {ok:false,error:'Поле "entries" должно быть непустым массивом.'};
  }

  const required=['overlap','noise','x_divisor','z_divisor','rotation_degrees','multiplier','center_x','center_z'];
  for(let i=0;i<value.entries.length;i++){
    const e=value.entries[i];
    if(!e || typeof e!=='object' || Array.isArray(e)){
      return {ok:false,error:`entries[${i}] — должен быть объектом.`};
    }
    for(const key of required){
      if(!(key in e)) return {ok:false,error:`entries[${i}] — отсутствует "${key}".`};
    }
    if(typeof e.overlap!=='boolean'){
      return {ok:false,error:`entries[${i}].overlap — должен быть true/false.`};
    }
    const nums=['x_divisor','z_divisor','rotation_degrees','multiplier','center_x','center_z'];
    for(const key of nums){
      if(typeof e[key]!=='number' || !Number.isFinite(e[key])){
        return {ok:false,error:`entries[${i}].${key} — должно быть числом.`};
      }
    }
    if(e.x_divisor<=0 || e.z_divisor<=0){
      return {ok:false,error:`entries[${i}] — x_divisor и z_divisor должны быть больше 0.`};
    }
    const n=e.noise;
    if(!n || typeof n!=='object' || Array.isArray(n)){
      return {ok:false,error:`entries[${i}].noise — должен быть объектом.`};
    }
    if(!Array.isArray(n.amplitudes) || n.amplitudes.length===0 ||
       n.amplitudes.some(x=>typeof x!=='number' || !Number.isFinite(x))){
      return {ok:false,error:`entries[${i}].noise.amplitudes — нужен массив чисел.`};
    }
    if((typeof n.seed!=='string' && typeof n.seed!=='number') ||
       !Number.isFinite(Number(n.seed))){
      return {ok:false,error:`entries[${i}].noise.seed — должен быть числом или строкой с числом.`};
    }
    if(typeof n.first_octave!=='number' || !Number.isFinite(n.first_octave) ||
       typeof n.scale!=='number' || !Number.isFinite(n.scale)){
      return {ok:false,error:`entries[${i}].noise — first_octave и scale должны быть числами.`};
    }
  }
  return {ok:true};
}

function importConfigJson(text){
  let parsed;
  try{ parsed=JSON.parse(text); }
  catch(e){ showToast('JSON некорректен: не удалось разобрать файл.', 'error'); return false; }

  const check=validateConfigJson(parsed);
  if(!check.ok){
    showToast(`Конфиг не принят: ${check.error}`, 'error');
    return false;
  }

  const before=snapshotState();
  const continents=parsed.entries.map((e,i)=>({
    id:i+1,
    name:`Континент ${i+1}`,
    overlap:e.overlap,
    multiplier:e.multiplier,
    centerX:e.center_x,
    centerZ:e.center_z,
    xDivisor:e.x_divisor,
    zDivisor:e.z_divisor,
    rotation:e.rotation_degrees,
    noise:{
      seed:String(e.noise.seed),
      firstOctave:e.noise.first_octave,
      scale:e.noise.scale,
      amplitudes:e.noise.amplitudes.slice()
    }
  }));

  state.continents=continents;
  state.nextId=continents.length+1;
  state.selected=continents[0].id;
  renderLayers();
  renderEditor();
  scheduleRender();
  save();
  pushHistory(before);
  showToast(`JSON принят: загружено слоёв — ${continents.length}.`, 'success');
  return true;
}

document.getElementById('pasteJsonBtn').onclick=async ()=>{
  try{
    const text=await navigator.clipboard.readText();
    if(!text || !text.trim()){
      showToast('Буфер обмена пуст — вставлять нечего.', 'error');
      return;
    }
    importConfigJson(text);
  }catch(e){
    showToast('Не удалось прочитать буфер обмена. Разреши доступ к буферу для сайта.', 'error');
  }
};

document.getElementById('exportBtn').onclick=async ()=>{
  const json=buildEntriesJson();
  try{ await navigator.clipboard.writeText(json); statusEl.textContent='JSON скопирован в буфер обмена'; }
  catch(e){ statusEl.textContent='Не удалось скопировать — открой консоль'; console.log(json); }
};

document.getElementById('downloadJsonBtn').onclick=()=>{
  const json=buildEntriesJson();
  const blob=new Blob([json], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.download='continents.json'; a.href=url; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  statusEl.textContent='continents.json скачан';
};

// ---------- reference image ----------
const referenceFile=document.getElementById('referenceFile');
const referenceUploadBtn=document.getElementById('referenceUploadBtn');
const referenceControls=document.getElementById('referenceControls');
const referenceLayer=document.getElementById('referenceLayer');
const referenceImage=document.getElementById('referenceImage');
const referenceCycle=document.getElementById('referenceCycle');
const referenceRemove=document.getElementById('referenceRemove');
let referenceUrl=null;
let referenceMode='mini';
referenceUploadBtn.onclick=()=>referenceFile.click();
function updateReferenceUI(){
  const has=!!referenceUrl;
  referenceControls.classList.toggle('active',has);
  referenceLayer.classList.toggle('mini',has && referenceMode==='mini');
  referenceLayer.classList.toggle('full',has && referenceMode==='full');
  referenceLayer.style.display=has && referenceMode!=='hidden'?'block':'none';
  if(!has){
    referenceCycle.textContent='Карта';
    referenceCycle.classList.remove('active');
    return;
  }
  referenceCycle.textContent='Карта';
  referenceCycle.classList.toggle('active',referenceMode!=='hidden');
  referenceCycle.title=referenceMode==='mini'
    ? 'Карта: сейчас угол → нажми для полной карты (M)'
    : referenceMode==='full'
      ? 'Карта: сейчас полная → нажми для скрытия (M)'
      : 'Карта: сейчас скрыто → нажми для угла (M)';
}
function cycleReferenceMode(){
  if(!referenceUrl)return;
  referenceMode=referenceMode==='mini'?'full':referenceMode==='full'?'hidden':'mini';
  updateReferenceUI();
}
referenceFile.onchange=()=>{
  const file=referenceFile.files?.[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){showToast('Можно загрузить только изображение.','error');referenceFile.value='';return;}
  if(referenceUrl)URL.revokeObjectURL(referenceUrl);
  referenceUrl=URL.createObjectURL(file);
  referenceImage.src=referenceUrl;
  referenceImage.onload=()=>{referenceMode='mini';updateReferenceUI();showToast(`Референс загружен: ${file.name}`,'success');};
  referenceImage.onerror=()=>{if(referenceUrl)URL.revokeObjectURL(referenceUrl);referenceUrl=null;referenceImage.removeAttribute('src');referenceFile.value='';updateReferenceUI();showToast('Не удалось открыть изображение.','error');};
};
referenceCycle.onclick=cycleReferenceMode;
referenceRemove.onclick=()=>{if(referenceUrl)URL.revokeObjectURL(referenceUrl);referenceUrl=null;referenceImage.removeAttribute('src');referenceFile.value='';updateReferenceUI();};
referenceLayer.addEventListener('dblclick',()=>{if(referenceUrl)cycleReferenceMode();});

// ---------- map navigation: zoom + pan (visual only; world parameters stay unchanged) ----------
const mapFrame=document.getElementById('mapFrame');
const canvasWrap=document.getElementById('canvasWrap');
const zoomValue=document.getElementById('zoomValue');
let viewScale=1, panX=0, panY=0, pointerStart=null;
const MIN_ZOOM=0.5, MAX_ZOOM=5;



function updateView(animate=true){
  mapFrame.style.transition=animate?'transform .12s ease-out':'none';
  mapFrame.style.transform=`translate(${panX}px, ${panY}px) scale(${viewScale})`;
  zoomValue.textContent=`${Math.round(viewScale*100)}%`;
  document.getElementById('zoomOut').disabled=viewScale<=MIN_ZOOM;
  document.getElementById('zoomIn').disabled=viewScale>=MAX_ZOOM;
}
function zoomAt(nextScale, clientX, clientY){
  nextScale=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,nextScale));
  if(nextScale===viewScale)return;
  const rect=canvasWrap.getBoundingClientRect();
  const x=clientX-(rect.left+rect.width/2), y=clientY-(rect.top+rect.height/2);
  const ratio=nextScale/viewScale;
  panX=x-(x-panX)*ratio;
  panY=y-(y-panY)*ratio;
  viewScale=nextScale;
  updateView();
}
document.getElementById('zoomIn').onclick=()=>{const r=canvasWrap.getBoundingClientRect();zoomAt(viewScale*1.2,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zoomOut').onclick=()=>{const r=canvasWrap.getBoundingClientRect();zoomAt(viewScale/1.2,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('resetView').onclick=()=>{viewScale=1;panX=0;panY=0;updateView()};
canvasWrap.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(viewScale*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY);
},{passive:false});
function updateMapCoords(e){
  const rect=cv.getBoundingClientRect();
  if(e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom){
    mapCoords.style.display='none'; return;
  }
  const worldWidth=parseFloat(document.getElementById('worldWidth').value)||4000;
  const worldHeight=worldWidth*(cv.height/cv.width);
  const px=(e.clientX-rect.left)/rect.width, pz=(e.clientY-rect.top)/rect.height;
  const x=Math.round(-worldWidth/2 + px*worldWidth), z=Math.round(-worldHeight/2 + pz*worldHeight);
  mapCoords.textContent=`X: ${x} · Z: ${z}`;
  const wrapRect=canvasWrap.getBoundingClientRect();
  mapCoords.style.left=`${e.clientX-wrapRect.left+14}px`;
  mapCoords.style.top=`${e.clientY-wrapRect.top+14}px`;
  mapCoords.style.display='block';
}
cv.addEventListener('pointermove',updateMapCoords);
cv.addEventListener('pointerleave',()=>{mapCoords.style.display='none';});

cv.addEventListener('pointerdown',e=>{
  if(e.button!==0 && e.pointerType==='mouse')return;
  pointerStart={x:e.clientX,y:e.clientY,panX,panY};
  cv.classList.add('dragging');
  cv.setPointerCapture?.(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!pointerStart)return;
  panX=pointerStart.panX+(e.clientX-pointerStart.x);
  panY=pointerStart.panY+(e.clientY-pointerStart.y);
  updateView(false);
});
function endPan(){pointerStart=null;cv.classList.remove('dragging');}
cv.addEventListener('pointerup',endPan);
cv.addEventListener('pointercancel',endPan);
updateView(false);
renderLayers(); renderEditor(); updateHistoryButtons(); doRender();
</script>
